name: Daily News Push

on:
  # schedule removed — triggered by cron-job.org at 09:50 CST via workflow_dispatch
  # keeping only manual trigger to avoid duplicate email sends
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Push news to subscribers
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://daily-news-job.cfapps.ap21.hana.ondemand.com/run" \
            -H "Content-Type: application/json" \
            -d '{"need_notify": true, "force_refresh": false, "push_type": "general"}')
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Status: $STATUS"
          echo "Response: $BODY"
