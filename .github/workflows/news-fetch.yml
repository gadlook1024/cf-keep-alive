name: Daily News Fetch

on:
  # schedule removed — triggered by cron-job.org at 08:50 CST via workflow_dispatch
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch today news
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://daily-news-job.cfapps.ap21.hana.ondemand.com/api/today_news?type=general")
          echo "Fetch response status: $STATUS"
